<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Feedback Form</title>
    <link rel="icon" type="image/x-icon" href="./Images/Logo.png">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="main-container">
    <div class="form-wrapper">
        <!-- <img
            src="./Images/Logo.png"
            alt="Survey Form Illustration"
            class="form-image"
        /> -->

        <form action="/feedback" method="POST">
            <!-- Title and Description -->
            <div class="form-header">
                <h2 class="form-title">Customer Feedback Survey</h2>
                <p class="form-description">
                    Please provide your feedback to help us improve. All
                    required fields are marked with *.
                </p>
            </div>

            <!-- Basic Information -->
            <div class="form-group">
                <label for="fullname" class="form-label">Full Name</label>
                <input
                    type="text"
                    name="fullname"
                    id="fullname"
                    class="form-input"
                />
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email Address*</label>
                <input
                    type="email"
                    name="email"
                    id="email"
                    class="form-input"
                    required
                />
            </div>
                          <!-- Rating Fields -->
            <div class="form-group">
                <label class="form-label">Overall Satisfaction*</label>
                <div class="star-rating-group">
                    <input
                        type="radio"
                        id="star5"
                        name="overall-satisfaction"
                        value="5"
                        required
                    /><label for="star5" title="5 stars">★</label>
                    <input
                        type="radio"
                        id="star4"
                        name="overall-satisfaction"
                        value="4"
                    /><label for="star4" title="4 stars">★</label>
                    <input
                        type="radio"
                        id="star3"
                        name="overall-satisfaction"
                        value="3"
                    /><label for="star3" title="3 stars">★</label>
                    <input
                        type="radio"
                        id="star2"
                        name="overall-satisfaction"
                        value="2"
                    /><label for="star2" title="2 stars">★</label>
                    <input
                        type="radio"
                        id="star1"
                        name="overall-satisfaction"
                        value="1"
                    /><label for="star1" title="1 star">★</label>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label"
                    >Rate the Quality of Product</label
                >
                <div class="options-group">
                    <label class="option-item"
                        ><input
                            type="radio"
                            name="service-quality"
                            value="excellent"
                            class="form-radio"
                        />
                        Excellent</label
                    >
                    <label class="option-item"
                        ><input
                            type="radio"
                            name="service-quality"
                            value="good"
                            class="form-radio"
                        />
                        Good</label
                    >
                    <label class="option-item"
                        ><input
                            type="radio"
                            name="service-quality"
                            value="average"
                            class="form-radio"
                        />
                        Average</label
                    >
                    <label class="option-item"
                        ><input
                            type="radio"
                            name="service-quality"
                            value="poor"
                            class="form-radio"
                        />
                        Poor</label
                    >
                </div>
            </div>

                       <div class="form-group">
                <label class="form-label">Would You Recommend Us?</label>
                <div class="options-group">
                    <label class="option-item"
                        ><input
                            type="radio"
                            name="recommendation"
                            value="yes"
                            class="form-radio"
                        />
                        Yes</label
                    >
                    <label class="option-item"
                        ><input
                            type="radio"
                            name="recommendation"
                            value="no"
                            class="form-radio"
                        />
                        No</label
                    >
                </div>
            </div>

            <!-- Open-Ended Feedback -->
            <div class="form-group">
                <label for="liked-most" class="form-label"
                    >What did you like most?</label
                >
                <textarea
                    name="feedback"
                    id="liked-most"
                    rows="3"
                    class="form-textarea"
                ></textarea>
            </div>

            <div class="form-group">
                <label for="improvement" class="form-label"
                    >What could we improve?</label
                >
                <textarea
                    name="improvement"
                    id="improvement"
                    rows="3"
                    class="form-textarea"
                ></textarea>
            </div>

            <div class="form-group">
                <label for="additional-comments" class="form-label"
                    >Additional Comments or Suggestions</label
                >
                <textarea
                    name="comments"
                    id="additional-comments"
                    rows="3"
                    class="form-textarea"
                ></textarea>
            </div>
            
            <!-- Survey-Specific Inputs -->
            <div class="form-group">
                <label class="form-label">Please rate the following:</label>
                <div class="options-group">
                    <label class="option-item"
                        ><input
                            type="radio"
                            name="likert-scale"
                            value="strongly-agree"
                            class="form-radio"
                        />
                        Strongly Agree</label
                    >
                    <label class="option-item"
                        ><input
                            type="radio"
                            name="likert-scale"
                            value="agree"
                            class="form-radio"
                        />
                        Agree</label
                    >
                    <label class="option-item"
                        ><input
                            type="radio"
                            name="likert-scale"
                            value="neutral"
                            class="form-radio"
                        />
                        Neutral</label
                    >
                    <label class="option-item"
                        ><input
                            type="radio"
                            name="likert-scale"
                            value="disagree"
                            class="form-radio"
                        />
                        Disagree</label
                    >
                    <label class="option-item"
                        ><input
                            type="radio"
                            name="likert-scale"
                            value="strongly-disagree"
                            class="form-radio"
                        />
                        Strongly Disagree</label
                    >
                </div>
            </div>

           
            <!-- Consent & Follow-up -->
            <div class="consent-group">
                <input type="checkbox" id="follow-up" class="form-checkbox" />
                <label for="follow-up" class="consent-label"
                    >I allow you to contact me for follow-up.</label
                >
            </div>

            <div class="consent-group">
                <input
                    type="checkbox"
                    id="testimonial-consent"
                    class="form-checkbox"
                />
                <label for="testimonial-consent" class="consent-label"
                    >I agree to share this feedback publicly (for
                    testimonial/marketing use).</label
                >
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Submit Feedback</button>
            <button type="button" class="export-btn submit-btn" onclick="window.location.href='/feedback/exportData'">See all Feedbacks</button>
        </form>

<style>
.export-btn {
    padding: 10px 20px;
    background-color: #10b981;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: 500;
    margin-top: 10px;
}
.export-btn:hover {
    background-color: #059669;
}
</style>
</div>
</div>
</body>
</html>
